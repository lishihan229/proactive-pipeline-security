[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proactive-pipeline-security"
version = "0.1.0"
description = "Local-first staged-diff security analysis for Git hooks"
requires-python = ">=3.10"

[project.scripts]
pipeline-security = "pipeline_security.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
